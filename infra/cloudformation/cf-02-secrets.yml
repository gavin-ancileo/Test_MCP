AWSTemplateFormatVersion: '2010-09-09'
Description: 'Secrets Manager baseline for AAP/<Env>/... path'
Parameters:
  Env:
    Type: String
    Default: uat
Resources:
  AgentCoreSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'AAP/${Env}/agentcore'
      Description: AgentCore env bundle (JSON key-value)
      SecretString: |
        {
          "OPENAI_API_KEY":"",
          "OPENAI_MODEL":"gpt-4o-mini",
          "DDB_TABLE":"lea-agent-messages",
          "DDB_SESSION_TABLE":"lea-agent-sessions",
          "ANCILEO_HUB_BASE_URL":"",
          "AI_API_BASE_URL":"",
          "AI_AUTH_BASE_URL":"",
          "AI_AUTH_USERNAME":"",
          "AI_AUTH_PASSWORD":"",
          "TELEGRAM_TOKEN":""
        }
  N8nSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'AAP/${Env}/n8n'
      Description: n8n DB creds and encryption key
      SecretString: |
        {
          "POSTGRES_HOST":"",
          "POSTGRES_PORT":"5432",
          "POSTGRES_DB":"n8n",
          "POSTGRES_USER":"n8nuser",
          "POSTGRES_PASSWORD":"",
          "N8N_ENCRYPTION_KEY":""
        }
Outputs:
  AgentCoreSecretArn: {Value: !Ref AgentCoreSecret}
  N8nSecretArn: {Value: !Ref N8nSecret}
