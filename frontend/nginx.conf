server {
    listen 80;

    # Fix COOP policy to allow popup communication
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # CRITICAL: Prevent browser from caching old JS files
    # Force browser to always check with server for new versions
    location ~* \.(js|css|map)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Cache static assets that don't change (images, fonts)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # HTML files should not be cached
    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # Route /api/prompts -> MCP Server DIRECTLY (NOT via Agent API)
    # CRITICAL FIX: Admin Panel needs direct access to prompts management
    # Use ECS Service Discovery: mcp-server.aap.local:8001
    # Handle both /api/prompts (list all) and /api/prompts/{code} (CRUD operations)
    location /api/prompts/ {
        proxy_pass http://mcp-server.aap.local:8001/prompts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type application/json;
        # Nginx automatically forwards all HTTP methods (GET, POST, PUT, DELETE)
    }

    # Handle GET /api/prompts (list all - no trailing slash)
    location = /api/prompts {
        proxy_pass http://mcp-server.aap.local:8001/prompts;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type application/json;
    }

    # Route /api/config -> Agent API for frontend runtime config
    location = /api/config {
        proxy_pass http://agentcore.aap.local:8080/api/config;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Route /agentcore -> Agent API cho prompts
    location /agentcore/prompts {
        proxy_pass http://agentcore.aap.local:8080/agentcore/prompts;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type application/json;
    }

    # Route /agentcore/run -> Agent API cho AI chat
    location /agentcore/run {
        proxy_pass http://agentcore.aap.local:8080/agentcore/run;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type application/json;
    }

    # Route /agentcore/sessions -> Agent API cho chat history
    location /agentcore/sessions {
        proxy_pass http://agentcore.aap.local:8080/agentcore/sessions;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type application/json;
    }

    # Route /agentcore/healthz -> Agent API
    location /agentcore/healthz {
        proxy_pass http://agentcore.aap.local:8080/agentcore/healthz;
        proxy_set_header Host $host;
    }

    # Route /agentcore/n8n -> Agent API for n8n workflows management
    location /agentcore/n8n {
        proxy_pass http://agentcore.aap.local:8080/agentcore/n8n;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type application/json;
    }

    # Route OAuth provider callbacks -> Agent API (must be before /callback)
    # Match /callback/github, /callback/jira, /callback/google (google_drive)
    location ~ ^/callback/(github|jira|google|google_drive) {
        proxy_pass http://agentcore.aap.local:8080/integrations$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cognito SSO callback - handled by React app
    # This handles /callback (no provider suffix) for Cognito SSO
    location = /callback {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Route integrations API -> Agent API
    location /integrations/ {
        proxy_pass http://agentcore.aap.local:8080/integrations/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Route /mcp-server -> MCP Server for user management and database endpoints
    # IMPORTANT: Strip /mcp-server prefix by proxying to root /
    # Handle both /mcp-server (no trailing slash) and /mcp-server/ (with trailing slash)
    location /mcp-server/ {
        proxy_pass http://mcp-server.aap.local:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type application/json;
    }
    
    # Handle /mcp-server/prompts specifically (no trailing slash in request)
    location = /mcp-server/prompts {
        proxy_pass http://mcp-server.aap.local:8001/prompts;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type application/json;
    }
}

