server {
    listen 80;

    # Fix COOP policy to allow popup communication
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Route /agentcore -> MCP Server cho prompts (LOCAL)
    location /agentcore/prompts {
        proxy_pass http://mcp-server:8001/agentcore/prompts;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type application/json;
    }

    # Route /agentcore/run -> Agent API cho AI chat (LOCAL)
    location /agentcore/run {
        proxy_pass http://agent-api:8000/agentcore/run;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # Route /agentcore/healthz -> Agent API (LOCAL)
    location /agentcore/healthz {
        proxy_pass http://agent-api:8000/agentcore/healthz;
        proxy_set_header Host $host;
    }

    # Route OAuth provider callbacks -> Agent API (LOCAL)
    location ~ ^/callback/(github|jira|google|google_drive) {
        proxy_pass http://agent-api:8000/integrations$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cognito SSO callback - handled by React app
    location = /callback {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Route integrations API -> Agent API (LOCAL)
    location /integrations/ {
        proxy_pass http://agent-api:8000/integrations/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # Route /mcp-server -> MCP Server for user management (LOCAL)
    location /mcp-server/ {
        proxy_pass http://mcp-server:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type application/json;
    }
}
