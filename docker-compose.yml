services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: ${DB_NAME:-aap_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    volumes:
      - ./infra/scripts/00-init-database.sql:/docker-entrypoint-initdb.d/00-init-database.sql
      - ./infra/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-prompts.sql
      - ./infra/migrations:/migrations
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp-server:
    build: ./backend/mcp-server
    ports:
      - "8001:8001"
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-aap_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      N8N_URL: ${N8N_URL:-http://n8n:5678}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # N8N Workflow Automation
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=localhost
      - N8N_PROTOCOL=http
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  agent-api:
    build:
      context: ./backend/agent-api
      dockerfile: Dockerfile.local
    ports:
      - "8000:8000"
    environment:
      USE_OPENAI: ${USE_OPENAI:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-2}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-aap-conversations}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_REGION: ${COGNITO_REGION:-ap-southeast-2}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost/callback/github}
      JIRA_CLIENT_ID: ${JIRA_CLIENT_ID}
      JIRA_CLIENT_SECRET: ${JIRA_CLIENT_SECRET}
      JIRA_REDIRECT_URI: ${JIRA_REDIRECT_URI:-http://localhost/callback/jira}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost/callback/google}
      MCP_URL: ${MCP_URL:-http://mcp-server:8001}
      FORCE_ADMIN_MODE: ${FORCE_ADMIN_MODE:-true}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
      args:
        VITE_COGNITO_DOMAIN: ${VITE_COGNITO_DOMAIN}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID}
        VITE_COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID}
        VITE_COGNITO_REGION: ${VITE_COGNITO_REGION:-ap-southeast-2}
        VITE_COGNITO_REDIRECT_URI: ${VITE_COGNITO_REDIRECT_URI:-http://localhost/callback}
        VITE_AGENTCORE_URL: ${VITE_AGENTCORE_URL:-http://localhost/agentcore}
        VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-local}
    ports:
      - "80:80"
    depends_on:
      - agent-api
      - mcp-server

volumes:
  postgres-data:
  n8n_data:
